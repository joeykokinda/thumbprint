<!doctype html>
<meta charset="utf-8">
<style>
  :root { --accent: #00875a; --text: #0f1419; --muted: #536471; --border: #eff3f4; --surface: #fff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --accent: #14f195; --text: #e7e9ea; --muted: #71767b; --border: #2f3336; --surface: #000; } }
  body { margin: 0; width: 320px; padding: 16px; background: var(--surface); color: var(--text); font: 400 14px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 15px; font-weight: 700; }
  header svg { width: 20px; height: 20px; color: var(--accent); }
  section { padding: 16px 0; border-top: 1px solid var(--border); }
  h2 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
  p { margin: 0; color: var(--muted); font-size: 13px; line-height: 18px; }
  #qr { display: block; width: 168px; height: 168px; margin: 16px auto 0; padding: 12px; border-radius: 12px; background: #fff; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--muted); }
  .on .dot { background: var(--accent); }
  label.row { cursor: pointer; }
  input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  [hidden] { display: none !important; }
</style>
<header>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 3.2-6.4"/><path d="M10.4 4.16A8 8 0 0 1 20 12v4"/><path d="M8 19v-7a4 4 0 0 1 8 0v7"/><path d="M12 12v8"/></svg>
  Thumbprint
</header>
<section>
  <div class="row"><h2>Your Seeker</h2><span id="status"><span class="dot"></span><span id="status-text">Checking</span></span></div>
  <div id="pairing" hidden>
    <p>To sign your own posts, scan this with your Seeker. Reading needs no phone.</p>
    <img id="qr" alt="Pairing code">
  </div>
</section>
<section>
  <label class="row"><span>Dim posts with no approval</span><input type="checkbox" id="dim"></label>
</section>
<script src="popup.js"></script>
